<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti, mi amor ♥</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Georgia, "Times New Roman", serif; overflow:hidden;
  background:radial-gradient(circle at 20% 20%,#ffe5ef 0,#ffd4e4 25%,transparent 55%),
             radial-gradient(circle at 80% 80%,#f8d9e7 0,#f4c7da 25%,transparent 55%),#fff8fb;
  color:#5a3442;
}
.petal{position:fixed;color:#e58aaa;opacity:.45;font-size:20px;animation:float 7s linear infinite}
.p1{left:8%;top:15%}.p2{left:82%;top:20%;animation-delay:1s}.p3{left:20%;top:75%;animation-delay:2s}.p4{left:75%;top:78%;animation-delay:3s}
@keyframes float{50%{transform:translateY(-30px) rotate(10deg)}100%{transform:translateY(0)}}
.card{
  width:min(92vw,520px); padding:34px 28px; text-align:center; border-radius:28px;
  background:rgba(255,255,255,.72); backdrop-filter:blur(12px);
  box-shadow:0 20px 70px rgba(139,62,92,.18); border:1px solid rgba(255,255,255,.8);
}
.heart{font-size:58px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
h1{margin:8px 0 8px;font-size:34px;color:#a63f68}
.subtitle{margin:0 auto 26px;line-height:1.6;font-size:17px}
.envelope{
  position:relative;margin:22px auto 24px;width:260px;height:170px;cursor:pointer;
  perspective:900px;
}
.env-body{
  position:absolute;inset:0;background:#f7a9c2;border-radius:8px;
  box-shadow:0 14px 30px rgba(130,52,81,.18);overflow:hidden;
}
.env-body:before,.env-body:after{
  content:"";position:absolute;bottom:0;width:0;height:0;border-style:solid;z-index:2;
}
.env-body:before{left:0;border-width:85px 130px 0 0;border-color:#ec86a9 transparent transparent transparent}
.env-body:after{right:0;border-width:85px 0 0 130px;border-color:#df7098 transparent transparent transparent}
.flap{
  position:absolute;left:0;top:0;width:0;height:0;border-left:130px solid transparent;
  border-right:130px solid transparent;border-top:90px solid #f9bfd2;z-index:4;
  transform-origin:top;transition:transform .75s ease;
}
.seal{
  position:absolute;z-index:5;left:50%;top:48%;transform:translate(-50%,-50%);
  width:48px;height:48px;border-radius:50%;background:#b83f6d;color:white;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 5px 12px rgba(100,30,60,.25);transition:.4s;
}
.envelope.open .flap{transform:rotateX(180deg)}
.envelope.open .seal{opacity:0;transform:translate(-50%,-30%) scale(.7)}
button{
  border:0;border-radius:999px;padding:14px 25px;font-size:16px;font-weight:bold;
  background:#b83f6d;color:white;cursor:pointer;box-shadow:0 10px 22px rgba(184,63,109,.25);
  transition:.2s;
}
button:hover{transform:translateY(-2px)}
#pdfBox{display:none;margin-top:22px}
#pdfBox.show{display:block;animation:appear .7s ease}
@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
iframe{width:100%;height:520px;border:0;border-radius:15px;background:white}
.small{font-size:12px;opacity:.7;margin-top:15px}
</style>
</head>
<body>
<div class="petal p1">♥</div><div class="petal p2">♥</div><div class="petal p3">♥</div><div class="petal p4">♥</div>

<main class="card">
  <div class="heart">♥</div>
  <h1>Para mi persona favorita</h1>
  <p class="subtitle">Tenemos una pequeña sorpresa por nuestros <b>16 meses</b>.<br>Haz clic en el sobre para abrir tu carta.</p>

  <div class="envelope" id="envelope" onclick="openLetter()">
    <div class="env-body"></div>
    <div class="flap"></div>
    <div class="seal">♥</div>
  </div>

  <button onclick="openLetter()">Abrir mi carta</button>

  <section id="pdfBox">
    <p><b>Tu carta está aquí ♥</b></p>
    <iframe src="carta_16_meses.pdf" title="Carta de 16 meses"></iframe>
    <p class="small">Si quieres guardarla, usa el botón de descarga del visor de PDF.</p>
  </section>
</main>

<script>
function openLetter(){
  const env=document.getElementById('envelope');
  const box=document.getElementById('pdfBox');
  env.classList.add('open');
  setTimeout(()=>box.classList.add('show'),650);
  setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'center'}),700);
}
</script>
</body>
</html>
